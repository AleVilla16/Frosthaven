<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compagno di Frosthaven</title>
<meta name="description" content="Compagno di gioco per Frosthaven: fasi del round, iniziativa, personaggi, mostri, mazzi, bottini e regole in italiano.">
<meta name="theme-color" content="#e9eff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frosthaven">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: barra in alto con le sezioni; Partita = colonna di gioco (round, turno, iniziativa) + colonna strumenti (regole, mazzi, bottini); barra fissa in basso con la prossima mossa. */
:root{
  --bg:#e9eff4; --surface:#ffffff; --surface2:#e3ebf1; --ink:#12212d; --muted:#566977; --line:#cdd9e1;
  --accent:#b8501a; --accent2:#c9601f; --accent-ink:#ffffff; --frost:#1d6a8c; --frost-soft:#d8ebf3;
  --good:#25744a; --bad:#b02f25; --warn:#b07a0c; --elite:#8f6a00;
  --shadow:0 1px 2px rgb(18 33 45/.06),0 10px 28px -16px rgb(18 33 45/.28);
  --av1:#1d6a8c; --av2:#8a4fa0; --av3:#2f7d5b; --av4:#b8501a; --av5:#3f5fb0; --av6:#a03a5a; --mon:#9c2f27; --ally:#2a6d49; --av-ink:#ffffff;
  --el-fuoco:#d9512c; --el-ghiaccio:#3d97cc; --el-aria:#7f919e; --el-terra:#6a8a35; --el-luce:#c99a10; --el-buio:#6a58a0; --on-el:#ffffff;
  --std-n:#ffffff; --std-e:#f2c23c; --board:#13212c;
  --display:"Marcellus SC","Trajan Pro",Georgia,serif; --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#14222d; --surface2:#1c303e; --ink:#e7eff4; --muted:#93a8b6; --line:#27404f;
  --accent:#f08a3c; --accent2:#f6a45e; --accent-ink:#1b0e03; --frost:#7cc3e2; --frost-soft:#173545;
  --good:#5fc78d; --bad:#f28073; --warn:#e5bc41; --elite:#e5bc41;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -16px rgb(0 0 0/.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#14222d; --surface2:#1c303e; --ink:#e7eff4; --muted:#93a8b6; --line:#27404f;
  --accent:#f08a3c; --accent2:#f6a45e; --accent-ink:#1b0e03; --frost:#7cc3e2; --frost-soft:#173545;
  --good:#5fc78d; --bad:#f28073; --warn:#e5bc41; --elite:#e5bc41;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -16px rgb(0 0 0/.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 320px at 15% -90px,color-mix(in srgb,var(--frost) 22%,transparent),transparent 70%),radial-gradient(700px 280px at 95% -70px,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--frost);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.3rem} h3{font-size:1.05rem}

.top-in,.wrap{max-width:none;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-ico{width:40px;height:40px;flex:none}
.brand-logo{height:30px;width:auto;max-width:calc(100vw - 150px);object-fit:contain;object-position:left center;filter:drop-shadow(0 1px 2px rgb(0 0 0/.25))}
.ini-r.tg{cursor:pointer}
.inum{font-size:1.35rem;font-weight:700;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.field{gap:10px;background:var(--board);color:var(--ink);border-color:#22384a;--ink:#e7eff4;--muted:#9fb2bf;--line:#2c4352;--surface:#1c303e;--surface2:#26405a;--frost:#7cc3e2;--frost-soft:#173545;--bad:#f28073}
.toks{display:flex;flex-wrap:wrap;gap:10px}
.tok{width:100px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.tok.out{opacity:.45}
.tok-hp{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.tok-hp button{border:0;background:var(--surface2);width:26px;height:26px;cursor:pointer;font-weight:700;line-height:1}
.tok-hp b{min-width:2.4em;font-size:.95rem;color:var(--bad)}
.tok-hp b small{color:var(--muted);font-weight:400;font-size:.72rem}
.tok .bar{width:76px;height:4px}
.tav{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--c,var(--std-n));color:var(--c,var(--std-n));background:transparent}
.tav.e{--c:var(--std-e)}
.tav[data-a]{cursor:pointer}.tav[data-a]:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--std-n)) 22%,transparent)}
.tokw{display:flex;align-items:flex-start;gap:4px;min-width:0}
.tokw.out{opacity:.45}
.tstat{display:flex;flex-direction:column;gap:3px;padding:6px 10px 6px 8px;border-left:2px solid var(--std-n);max-width:150px;min-width:64px}
.tstat>.thp{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:3px}
.thp .bar{width:100%}
.tstat.e{border-left-color:var(--std-e)}
.tstat>span:not(.tnote):not(.thp){display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tstat small{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.tstat b{font-size:1.05rem;line-height:1.1}
.tstat.e b{color:var(--std-e)}
.tnote{font-size:.72rem;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.tnum{position:absolute;right:-8px;bottom:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--std-n));background:var(--board);display:grid;place-items:center;overflow:hidden}
.tnum input[type=number]{display:block;width:100%;height:100%;min-width:0;border:0;border-radius:50%;background:transparent;text-align:center;font:700 .85rem var(--body);color:var(--c,var(--std-n));padding:0;-moz-appearance:textfield;appearance:textfield}
.tnum input::-webkit-inner-spin-button,.tnum input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tok-nm{font-weight:600;font-size:.85rem;line-height:1.2;overflow-wrap:anywhere}
.tok-ty{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.tok-cd{font-size:.7rem;color:var(--bad);line-height:1.2}
.sep{border:0;border-top:1px dashed var(--line);margin:2px 0;width:100%}
.bld{display:flex;flex-direction:column}
.bld-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bld-r:last-child{border-bottom:0}
.bld-n{display:flex;flex-direction:column;min-width:0}.bld-n small,.bld-a small{color:var(--muted);font-size:.78rem}
.bld-a{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.bld-a:empty{display:none}
.bld-r.danneggiato .bld-n b{color:var(--warn)}.bld-r.distrutto .bld-n b{color:var(--bad)}
.warnc{color:var(--bad)}
.item-r{flex-wrap:nowrap;margin-top:6px}.item-r input{flex:1 1 6em;min-width:0}.item-r select{max-width:8.5em}
.item-r select.st-speso{color:var(--warn)}.item-r select.st-perso{color:var(--bad)}
.clockw{display:flex;align-items:center;gap:8px}.clockw b{font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:3.6em}
.ibtn.sm{width:32px;height:32px;box-shadow:none}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:6px}
.mlist-i{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.mlist-i::after{content:'›';color:var(--muted);font-size:1.2rem;line-height:1}
.mlist-i:hover{border-color:var(--frost)}
.mlist-i.on{border-color:var(--frost);background:var(--frost-soft)}
.mhead{display:flex;gap:12px;align-items:center}
.mhead>span{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
details.panel>summary{font-weight:600}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:2px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav a{flex:1 1 0;max-width:120px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;line-height:1.2}
.bnav a.on{color:var(--frost);background:var(--frost-soft)}
.tools{display:flex;gap:4px}
.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;min-height:36px}
.btn:hover{border-color:var(--frost)}
.btn.pri{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px -4px var(--accent)}
.btn.big{padding:10px 22px;font-size:1.05rem;min-height:46px}
.btn.sm{padding:3px 10px;font-size:.85rem;min-height:30px}
.btn.ghost{background:transparent}
.btn.warn{color:var(--bad)}
.mst th:not(:first-child),.mst td:not(:first-child){text-align:center}
.mst td{font-size:1.05rem}.mst td:not(:first-child){font-weight:700;font-size:1.25rem}
.mst tr.hn td{border-bottom:0}.mst tr.nt td{font-size:.9rem;color:var(--muted);padding-top:0}
.mst tr.off{opacity:.45}
@media (max-width:480px){.std{grid-template-columns:auto minmax(0,1fr) auto;grid-auto-flow:dense}.std>span:nth-child(3){grid-column:1/-1}.std>button{justify-self:end}}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.ibtn:hover{border-color:var(--frost);color:var(--frost)}
:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
input[type=number]{width:4.2em;text-align:center}
input[type=checkbox]{width:17px;height:17px;vertical-align:-3px;accent-color:var(--frost)}
textarea{width:100%;min-height:60px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;min-width:0}
label.f>*{font-size:1rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.88rem}
.pg{font:400 .78rem var(--body);color:var(--muted);white-space:nowrap;letter-spacing:0}
.guide{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--frost-soft);border-radius:14px;padding:12px 16px}
.guide>div{display:flex;flex-direction:column}
.how{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;counter-reset:h;flex:1 1 300px}
.how li{counter-increment:h;display:flex;align-items:center;gap:6px}
.how li::before{content:counter(h);width:22px;height:22px;border-radius:50%;background:var(--frost);color:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
/* partita */
.game{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.game.slim{grid-template-columns:minmax(0,1fr) 240px}
.game.slim .ini-panel{padding:12px;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.ini-panel .ini-r{padding:6px 8px;gap:8px;flex-wrap:nowrap}
.ini-panel .nm{flex:1 1 auto}
.ini-panel .nm b{line-height:1.2}
.ini-panel .av{width:32px;height:32px}.ini-panel .av svg{width:18px;height:18px}
.ini-panel input.init{flex:none;width:3em}
.ini-panel .inum{min-width:1.6em}
.ini-panel .row.sp{flex-direction:column;align-items:flex-start;gap:2px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.game{grid-template-columns:minmax(0,1fr)}}
.hero-top{display:flex;gap:14px 24px;align-items:center;flex-wrap:wrap}
.round{display:flex;align-items:center;gap:8px}
.round b{font:400 2.7rem/1 var(--display);color:var(--frost);min-width:1.1em;text-align:center}
.rb{display:flex;flex-direction:column;gap:3px}
.rb button{width:26px;height:21px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;cursor:pointer;line-height:1;font-weight:700}
.prog{display:flex;flex:1 1 300px;min-width:0}
.ps{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:0;color:var(--muted);font-weight:600;font-size:.84rem;min-width:0;text-align:center;line-height:1.15}
.ps::before{content:"";position:absolute;top:15px;right:50%;width:100%;height:3px;background:var(--line)}
.ps:first-child::before{display:none}
.ps.on::before,.ps.done::before{background:var(--frost)}
.dot{position:relative;z-index:1;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-weight:700;font-size:.95rem}
.ps.done .dot{background:var(--frost);border-color:var(--frost);color:var(--surface)}
.ps.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.ps.on{color:var(--ink)}
.status{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center}
.kv{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kv b{font-size:1.1rem;color:var(--ink);letter-spacing:0}
.els{display:flex;gap:4px 6px;flex-wrap:wrap}
.el{--c:var(--muted);width:60px;background:none;border:0;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:700;line-height:1.15}
.el i{font-style:normal;font-size:.68rem;font-weight:400;color:var(--muted)}
.disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c);color:var(--c);margin-bottom:2px}
.el[data-s="0"] .disc{opacity:.5}
.el[data-s="1"] .disc{border-style:solid;background:color-mix(in srgb,var(--c) 26%,transparent)}
.el[data-s="2"] .disc{border-style:solid;background:var(--c);color:var(--on-el);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}
ul.chk{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
ul.chk li::marker{color:var(--frost)}
.ini{display:flex;flex-direction:column;gap:6px}
.ini-r{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line)}
.ini-r.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ini-r.done{opacity:.55}
.ordn{width:1.1em;text-align:center;font-weight:700;color:var(--muted)}
.nm{flex:1 1 7em;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.nm b{font-weight:700}
.sub{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
input.init{width:3.3em;font-size:1.2rem;font-weight:700;padding:3px;border-radius:10px;border-width:2px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--av-ink);background:var(--a,var(--frost));flex:none;overflow:hidden}
.av.m{background-color:transparent;border:2px solid var(--mon);color:var(--mon)} .av.a{background-color:transparent;border:2px solid var(--ally);color:var(--ally)}
.av.img img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:52px;height:52px}
.bar{display:inline-block;height:6px;width:70px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.bar.mid i{background:var(--warn)} .bar.lo i{background:var(--bad)}
.bar.w{display:block;width:100%;height:8px;border-radius:4px}
.turn{border:2px solid var(--accent)}
.turn-h{display:flex;gap:12px;align-items:center}
.tn{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.note{border-left:3px solid var(--frost);background:color-mix(in srgb,var(--frost) 9%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;font-size:.93rem}
.note.w{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.mini{border-top:1px dashed var(--line);padding-top:12px}
.mc{min-width:44px;height:44px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:1.1rem;padding:0 6px;background:var(--surface2)}
.mc.g,.amc.g{border-color:var(--good);color:var(--good)} .mc.b,.amc.b{border-color:var(--bad);color:var(--bad)} .mc.off,.amc.off{opacity:.3}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dock-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px}
.dk{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.dock .row{flex-wrap:nowrap;flex:none}
/* contatori, condizioni */
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stp button{border:0;background:var(--surface2);width:32px;height:32px;cursor:pointer;font-weight:700;font-size:1.05rem}
.stp button:hover{background:var(--frost-soft)}
.stp b{min-width:2.6em;text-align:center;padding:0 4px}
.hp b{color:var(--bad)}
.cnt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.conds{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cd{border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent);border-radius:999px;padding:2px 10px;font-size:.84rem;cursor:pointer;font-weight:600}
.cd.p{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 9%,transparent)}
.conds select{font-size:.84rem;padding:3px 4px;max-width:9.5em;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card-h{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.card-h label.f{flex:1 1 110px}
details>summary{cursor:pointer;font-weight:600;color:var(--frost)}
details[open]>summary{margin-bottom:8px}
summary.ph{font:400 1.2rem var(--display);color:var(--ink);letter-spacing:.02em}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.std{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hpc{display:flex;flex-direction:column;gap:3px}.hpc .bar{width:100%}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--muted);font-size:.92rem}
.num.e{border-color:var(--elite);background:var(--elite);color:var(--surface)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.9rem;font-weight:600}
.chip:hover{border-color:var(--frost)}
.chip.on{background:var(--frost);border-color:var(--frost);color:var(--surface)}
.rule h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.amd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.amc{min-width:64px;height:84px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font:700 1.5rem var(--body);background:var(--surface2);padding:0 6px;text-align:center}
.amc.lg{font-size:.95rem;max-width:130px}
.ovl{position:fixed;inset:0;z-index:30;background:rgb(6 12 18/.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg);border-radius:18px;width:100%;max-width:560px;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgb(0 0 0/.4)}
.dlg-h{display:flex;align-items:center;gap:12px}
.dlg-h>.dlg-t{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.tok-open{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:inherit;font:inherit;border-radius:12px}
.tok-open:hover .tok-nm{color:var(--frost);text-decoration:underline}
.toast{z-index:40;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);font-weight:600;font-size:.92rem;box-shadow:var(--shadow)}
.ob{display:flex;gap:10px;align-items:flex-start}
.ob input{margin-top:3px;flex:none}
@media (prefers-reduced-motion:no-preference){.ini-r,.disc,.dot,.bar i{transition:background .2s,opacity .2s,width .25s,box-shadow .2s}}

<script>
/* ---------- dati di gioco (dal regolamento) ---------- */
const LV={conv:[2,2,3,3,4,4,5,6],trap:[2,3,4,5,6,7,8,9],haz:[1,2,2,2,3,3,3,4],xp:[4,6,8,10,12,14,16,18]};
const XPLV=[0,45,95,150,210,275,345,420,500];
const ELS=[['fuoco','Fuoco'],['ghiaccio','Ghiaccio'],['aria','Aria'],['terra','Terra'],['luce','Luce'],['buio','Oscurità']];
const ELST=['inerte','debole','forte'];
const CLASSI=['Alfiere','Geminato','Lama Fulminea','Plasmaossa','Ramingo','Viandante della Morte'];
const CLASSI_SB=['Crashing Tide','Deepwraith','Frozen Fist','H.I.V.E.','Infuser','Metal Mosaic','Pain Conduit','Pyroclast','Shattersong','Snowdancer','Trapper'];
const RES=[['legname','Legname'],['metallo','Metallo'],['pelle','Pelle'],['frecciavite','Frecciavite'],['ascianoce','Ascianoce'],['cappellocadavere','Cappellocadavere'],['fruttofiamma','Fruttofiamma'],['pietraradice','Pietraradice'],['fiorneve','Fiorneve']];
const LOOTT=[['monete','Monete',20],...RES.map(([k,n],i)=>[k,n,i<3?8:2]),['oggetto','Oggetto casuale',1]];
const LOOTN=Object.fromEntries(LOOTT);
const COND={
 rigenerazione:{n:'Rigenerazione',p:1,t:'Cura 1 su se stesso all’inizio di ogni turno, anche se stordito. Si rimuove quando subisce danni. Con Ferita: si applica prima Rigenerazione, che rimuove Ferita.',start:'Rigenerazione: Cura 1 su se stesso adesso (prima di Ferita).'},
 interdizione:{n:'Interdizione',p:1,t:'La prossima volta che sta per subire danni da qualsiasi fonte ne subisce la metà (arrotondata per difetto), poi si rimuove. Con Fragile si annullano a vicenda.'},
 invisibile:{n:'Invisibile',p:1,t:'Non può essere focalizzato né bersagliato dai nemici. I nemici possono attraversarlo ma non fermarsi nel suo esagono. Scade alla fine del suo turno successivo.',exp:1},
 rinforzo:{n:'Rinforzo',p:1,t:'Vantaggio a tutti i suoi attacchi. Scade alla fine del suo turno successivo.',exp:1,start:'Rinforzo: tutti i suoi attacchi hanno vantaggio.'},
 ferita:{n:'Ferita',t:'Subisce 1 danno all’inizio di ogni suo turno. Si rimuove quando viene curato.',start:'Ferita: subisce 1 danno adesso.'},
 fragile:{n:'Fragile',t:'La prossima volta che sta per subire danni da qualsiasi fonte ne subisce il doppio, poi si rimuove. Si rimuove anche con una cura.'},
 anatema:{n:'Anatema',t:'Subisce 10 danni alla fine del suo turno successivo, poi si rimuove. Si rimuove anche con una cura.',end:'Anatema: se l’aveva già prima di questo turno, subisce 10 danni ora e Anatema si rimuove.'},
 veleno:{n:'Veleno',t:'Tutti gli attacchi che lo bersagliano ottengono +1 Attacco. Una cura rimuove Veleno ma non aumenta i punti ferita.'},
 immobilizzare:{n:'Immobilizzare',t:'Non può effettuare capacità di movimento. Scade alla fine del suo turno successivo.',exp:1,start:'Immobilizzato: nessuna capacità di movimento.'},
 disarmare:{n:'Disarmare',t:'Non può effettuare capacità di attacco. Scade alla fine del suo turno successivo.',exp:1,start:'Disarmato: nessuna capacità di attacco.'},
 compromettere:{n:'Compromettere',t:'Solo personaggi. Non può usare né innescare oggetti; i bonus già ottenuti dagli oggetti restano. Scade alla fine del suo turno successivo.',exp:1,pc:1,start:'Compromesso: non può usare né innescare oggetti.'},
 stordire:{n:'Stordire',t:'Non può effettuare capacità né usare oggetti; i bonus già attivi restano. Un personaggio stordito sceglie comunque due carte (o dichiara un riposo lungo): le carte vengono scartate senza effetto. Scade alla fine del suo turno successivo.',exp:1,start:'Stordito: nessuna capacità e nessun oggetto in questo turno.'},
 confondere:{n:'Confondere',t:'Svantaggio a tutti i suoi attacchi. Scade alla fine del suo turno successivo.',exp:1,start:'Confuso: tutti i suoi attacchi hanno svantaggio.'}
};
const RULES=[
 {id:'movimento',c:'Capacità',t:'Movimento',p:24,b:['Muovi fino a X esagoni: puoi usarne meno, ma almeno 1 per contare come movimento.','Puoi attraversare gli alleati, non i nemici né gli ostacoli. Non puoi terminare in un esagono occupato.','Il terreno difficile costa 2 punti movimento per entrarvi.','Le trappole scattano quando entri nel loro esagono; il terreno pericoloso infligge danni in base al livello dello scenario.','Salto: ignori miniature e tessere lungo il percorso; l’ultimo esagono vale come movimento normale.','Volante: ignori miniature e tessere per tutto il movimento, ma non puoi terminare in un esagono occupato.','Entrare nell’esagono di una porta chiusa la apre e rivela la stanza (vedi «Rivelare e generare mostri»).']},
 {id:'attacco',c:'Capacità',t:'Attacco',p:25,b:['Senza gittata indicata è un attacco in mischia: solo nemici adiacenti. Serve la linea di vista.','Ordine di modifica: 1) bonus e penalità all’attacco (incluso +1 se il bersaglio ha Veleno); 2) carta modificatore di attacco; 3) scudo del bersaglio; 4) Interdizione e Fragile (insieme si annullano).','Pesca una carta modificatore separata per ogni bersaglio.','Gli effetti aggiunti (condizioni, spingere, tirare…) si applicano anche se l’attacco infligge 0 danni, ma non se il bersaglio muore o diventa sfinito.','Perforare X ignora fino a X punti di scudo.','Attacco a distanza contro un nemico adiacente: svantaggio.','Le carte ×2 e «nullo» fanno rimescolare il mazzo a fine round.']},
 {id:'vantaggio',c:'Capacità',t:'Vantaggio e svantaggio',p:27,b:['Vantaggio: pesca due carte modificatore e usa la migliore.','Svantaggio: pesca due carte e usa la peggiore.','Se non è chiaro quale sia migliore o peggiore, usa la prima pescata.','Vantaggio e svantaggio insieme si annullano, qualunque sia il numero delle fonti.']},
 {id:'cura',c:'Capacità',t:'Cura',p:29,b:['Cura X aumenta i punti ferita attuali di X, senza superare il massimo.','Una cura rimuove Ferita, Fragile, Anatema e Veleno in qualsiasi combinazione.','Se il bersaglio ha Veleno, la cura lo rimuove ma non aumenta i punti ferita.','Puoi curare anche una miniatura già al massimo dei punti ferita, per rimuoverne le condizioni.']},
 {id:'danni',c:'Capacità',t:'Subire danni',p:38,b:['Dopo Interdizione/Fragile, riduci i punti ferita oppure nega i danni.','Per negare tutti i danni di una fonte: perdi 1 carta a scelta dalla mano, oppure 2 carte a scelta dalla pila degli scarti.','Le due carte giocate in questo round non sono né in mano né negli scarti finché non hai svolto il turno: non puoi perderle.','Anche se neghi i danni, condizioni ed effetti della fonte si applicano comunque.','Lo scudo riduce solo i danni degli attacchi, non quelli di altre fonti (trappole, Ferita, ritorsione…).']},
 {id:'saccheggio',c:'Capacità',t:'Saccheggio',p:32,b:['Saccheggio X: raccogli tutti i segnalini bottino e le tessere tesoro entro X esagoni.','A fine turno ogni personaggio saccheggia l’esagono che occupa (non a ogni passo). Mostri ed evocazioni non lo fanno.','Per ogni segnalino bottino pesca una carta dal mazzo dei bottini.','Oro e risorse si incassano a fine scenario; gli oggetti casuali subito.','Il bottino rimasto sulla mappa a fine scenario è perso.']},
 {id:'riposo',c:'Capacità',t:'Riposare',p:38,b:['Servono almeno 2 carte nella pila degli scarti.','Riposo breve (a fine round): perdi 1 carta casuale dagli scarti e riprendi le altre. Una sola volta puoi subire 1 danno per perdere invece un’altra carta casuale.','Riposo lungo (dichiarato alla selezione delle carte, iniziativa 99, è l’intero turno): perdi 1 carta a scelta dagli scarti e riprendi le altre (obbligatorio); Cura 2 su te stesso (facoltativo); recuperi gli oggetti spesi (facoltativo).']},
 {id:'oggetti',c:'Capacità',t:'Oggetti',p:35,b:['Puoi usare gli oggetti durante il tuo turno o quando indicato dall’oggetto; non contano come azione.','Oggetti piccoli: ne porti al massimo metà del tuo livello, arrotondato per eccesso.','Gli oggetti spesi si recuperano con un riposo lungo; quelli persi restano tali fino a fine scenario.','Compromettere e Stordire impediscono di usarli.']},
 {id:'evocazione',c:'Capacità',t:'Evocazioni',p:31,b:['Vanno collocate in un esagono vuoto adiacente all’evocatore; se non ce ne sono, non viene evocata.','Non agiscono nel round in cui vengono evocate.','Agiscono subito prima del loro personaggio, nell’ordine in cui sono state evocate.','Non le controlli direttamente: seguono le regole automatizzate dei mostri (come «Movimento +0, Attacco +0»), salvo indicazione contraria.','Non saccheggiano a fine turno. Se l’evocatore diventa sfinito, vengono rimosse.']},
 {id:'forzato',c:'Capacità',t:'Spingere e tirare',p:32,b:['Spingere X: allontana il bersaglio di X esagoni; ogni esagono deve essere più lontano da te.','Tirare X: avvicina il bersaglio; ogni esagono deve essere più vicino a te.','Scegli tu il percorso. Il terreno difficile non costa di più; trappole e terreno pericoloso hanno effetto.','Se non può essere mosso per tutti gli X esagoni, si ferma prima.']},
 {id:'bonus',c:'Capacità',t:'Scudo, ritorsione e bonus attivi',p:30,b:['Scudo X: riduce di X i danni di ogni attacco in arrivo finché è attivo.','Ritorsione X: chi ti attacca da un esagono adiacente (o entro la gittata indicata) subisce X danni dopo l’attacco. Non si innesca se vieni ucciso o reso sfinito dall’attacco.','I bonus di round restano nell’area attiva fino a fine round; i bonus persistenti finché le condizioni indicate non sono soddisfatte.']},
 {id:'elementi',c:'Capacità',t:'Elementi',p:23,b:['Infondere: a fine turno l’elemento diventa forte.','Consumare: l’elemento deve essere già forte o debole all’inizio del turno; torna inerte e ottieni l’effetto.','A fine round ogni elemento cala di un passo: forte → debole → inerte.','Non puoi consumare un elemento infuso nello stesso turno.']},
 {id:'vista',c:'Capacità',t:'Linea di vista, gittata e bersagli',p:21,b:['C’è linea di vista se puoi tracciare una linea tra un punto qualsiasi dei due esagoni senza toccare un muro. Solo i muri la bloccano.','La gittata si conta in esagoni, senza passare attraverso i muri.','Non puoi bersagliare la stessa miniatura due volte con la stessa capacità.','Alleato non include te stesso, salvo indicazione.']},
 {id:'focus',c:'Mostri',t:'Focus dei mostri',p:41,b:['Il mostro cerca l’esagono di attacco raggiungibile e sceglie il nemico in quest’ordine: 1) percorso con meno esagoni negativi (trappole, terreno pericoloso); 2) percorso con meno punti movimento; 3) nemico più vicino per gittata; 4) nemico che agisce prima nell’ordine di iniziativa.','Se non esiste alcun percorso verso un esagono di attacco, non ha focus: non si muove e non attacca.','Se non attaccherà nel suo turno, o è disarmato, sceglie il focus come per un attacco in mischia a bersaglio singolo.','Se è stordito non determina il focus e ignora tutte le capacità.']},
 {id:'movmostri',c:'Mostri',t:'Movimento e attacco dei mostri',p:42,b:['Effettua le capacità della carta dall’alto in basso, e solo quelle elencate.','Si muove solo se finisce con un percorso più breve verso il suo esagono di attacco; altrimenti resta fermo.','Sceglie il percorso con meno esagoni negativi; non fa scattare una trappola se non è l’unico modo di arrivare al focus.','Con più bersagli, va dove può attaccare il focus e più nemici possibile, con meno attacchi in svantaggio possibile.','A parità, sceglie l’esagono che richiede meno movimento; se resta ambiguo decide il gruppo.','Un mostro a distanza adiacente al focus si allontana per evitare lo svantaggio, se può.']},
 {id:'ordmostri',c:'Mostri',t:'Ordine di attivazione dei mostri',p:40,b:['Una carta capacità per ogni serie di mostri sulla mappa: tutti i mostri della serie usano la stessa carta.','Prima gli elite in ordine crescente di pedina, poi i normali in ordine crescente.','I bonus attivi della carta non valgono fino al turno del mostro.']},
 {id:'morte',c:'Mostri',t:'Danni e morte dei mostri',p:45,b:['A zero punti ferita il mostro muore: rimuovilo e lascia un segnalino bottino nel suo esagono (non per alleati dello scenario ed evocazioni).','Gli effetti aggiunti dell’attacco che lo uccide non si applicano.','I punti ferita dei mostri con nome e dei boss possono dipendere da livello (L) e numero di personaggi (P).']},
 {id:'rivelare',c:'Mostri',t:'Rivelare e generare mostri',p:44,b:['Quando si apre una porta, prepara la stanza e i mostri rivelati. Agiscono in questo round.','Se la loro serie non ha ancora una carta capacità, pescane una adesso.','Se la loro iniziativa è già passata, agiscono subito dopo il turno della miniatura che li ha rivelati.','I mostri generati a inizio round agiscono normalmente; le miniature evocate durante il round non agiscono in quel round.']},
 {id:'boss',c:'Mostri',t:'Boss',p:45,b:['Hanno le immunità elencate sulla carta statistiche.','Le azioni speciali 1 e 2 citate sulla carta capacità sono descritte nelle regole dello scenario.']},
 {id:'sfinimento',c:'Personaggi',t:'Sfinimento',p:38,b:['Un personaggio è sfinito se arriva a 0 punti ferita, oppure se a inizio round non ha almeno 2 carte in mano né almeno 2 carte negli scarti.','Tutte le sue carte vanno nella pila delle carte perse e la miniatura viene rimossa.','Non riduce il numero di personaggi ai fini di punti ferita dei mostri o effetti dello scenario.','Se tutti i personaggi sono sfiniti, lo scenario è perso.']},
 {id:'xp',c:'Personaggi',t:'Punti esperienza e azioni perse',p:37,b:['Ottieni i punti esperienza indicati quando effettui l’azione che li riporta.','Un’azione con l’icona «persa» manda la carta nella pila delle carte perse non appena ne effettui una parte.','Non puoi effettuare due azioni superiori o due inferiori. Azioni base: qualsiasi carta vale Attacco 2 (superiore) o Movimento 2 (inferiore).']},
 {id:'livello',c:'Scenario',t:'Livello dello scenario',p:16,b:['Consigliato: livello medio dei personaggi diviso 2, arrotondato per eccesso. Puoi fissarlo a qualsiasi valore da 0 a 7.','Determina statistiche dei mostri, danni delle trappole, terreno pericoloso, conversione in oro ed esperienza bonus.']},
 {id:'bottini',c:'Scenario',t:'Mazzo dei bottini',p:16,b:['Si compone con il numero di carte per tipo indicato nella pagina dello scenario, scelte a caso e mescolate.','Monete: 20 carte con valore da 1 a 3, da convertire in oro in base al livello dello scenario.','Materiali (legname, metallo, pelle): 8 carte per tipo; la quantità dipende dal numero di personaggi.','Vegetali: 2 carte per tipo, 1 vegetale ciascuna. Oggetto casuale: 1 carta, si ottiene subito.']},
 {id:'fine',c:'Scenario',t:'Fine di uno scenario',p:47,b:['Lo scenario termina solo alla fine del round in cui si verifica la condizione. Perso e completato nello stesso round = perso.','Esperienza: quella del contatore, più il bonus di livello se completato.','Oro: monete delle carte bottino × conversione, sia che vinci sia che perdi.','Recuperi tutte le carte e gli oggetti, punti ferita al massimo, via tutte le condizioni e le carte benedizione/maledizione.','Scenario perso: puoi tornare a Frosthaven (tieni le risorse, fai la Fase dell’Avamposto) oppure rigiocarlo subito (niente risorse, niente avamposto, niente evento di strada).']},
 {id:'avanzare',c:'Avamposto',t:'Avanzare di livello',p:62,b:['Soglie di esperienza: 45, 95, 150, 210, 275, 345, 420, 500 (livelli 2–9).','Si avanza durante la Riorganizzazione: aggiungi una carta di livello pari o inferiore al nuovo, aumenta i punti ferita come da plancia, ottieni un talento.']}
];

 {t:'Preparazione',p:8,b:['Risolvete un evento di strada, se lo scenario non è collegato al precedente.','Fissate il livello dello scenario (consigliato: livello medio ÷ 2, arrotondato per eccesso).','Preparate mappa, mostri della prima stanza e mazzo dei bottini come da pagina dello scenario.','Ogni personaggio pesca 3 obiettivi della battaglia e ne tiene 1.','Scegliete le carte in mano (pari alla dimensione della mano della classe) e gli oggetti equipaggiati.']},
 {t:'1 · Selezionare le carte',p:18,b:['Prima applicate gli effetti di inizio round dello scenario (per esempio le generazioni di mostri).','Ogni personaggio gioca 2 carte coperte: una è la carta iniziativa.','In alternativa, con almeno 2 carte negli scarti, può dichiarare un riposo lungo (iniziativa 99).','Chi non ha 2 carte in mano né 2 negli scarti diventa sfinito.','Niente numeri o titoli precisi: solo dichiarazioni generali («agisco presto», «ti curo»).']},
 {t:'2 · Ordine di iniziativa',p:19,b:['Rivelate le carte; pescate una carta capacità per ogni serie di mostri sulla mappa.','Parità tra personaggi: decide l’iniziativa della seconda carta. Personaggio contro mostro: prima il personaggio. Negli altri casi decide il gruppo.','Le evocazioni agiscono subito prima del loro personaggio.']},
 {t:'3 · Turni',p:20,b:['Personaggio: l’azione superiore di una carta e l’inferiore dell’altra, nell’ordine che preferisce.','Mostro: elite prima dei normali, in ordine di pedina; ciascuno esegue la carta dall’alto in basso.','A fine turno il personaggio saccheggia il suo esagono e gli elementi infusi diventano forti.']},
 {t:'4 · Fine del round',p:46,b:['Innescate gli effetti di fine round di scenario, oggetti e carte.','Rimescolate i mazzi in cui è uscita una carta con l’icona mescolare (×2, nullo, capacità dei mostri).','Scartate (o perdete) le carte con bonus di round nell’area attiva.','Chi ha almeno 2 carte negli scarti può fare un riposo breve.','Gli elementi calano di un passo. Avanzate il contatore dei round.']},
 {t:'Fine dello scenario',p:47,b:['Si chiude solo a round concluso.','Segnate esperienza e oro, poi rimettete tutto a posto.']}
];

 {t:'1 · Passaggio del Tempo',p:59,b:'Segnate la settimana successiva sul calendario. Se il riquadro contiene numeri di sezione, leggetele subito, una alla volta.'},
 {t:'2 · Evento di Avamposto',p:60,b:'Pescate e risolvete un evento di avamposto della stagione in corso. Se è un evento di attacco, risolvete le prove di difesa sugli edifici bersagliati: gli edifici possono risultare danneggiati o demoliti.'},
 {t:'3 · Attività degli Edifici',p:62,b:'Risolvete le attività degli edifici costruiti e non demoliti, in ordine di numero.'},

 {t:'5 · Operazioni di Costruzione',p:68,b:'Riparate gli edifici danneggiati, poi potete costruire o migliorare un edificio pagando le risorse richieste.'}

function ruleCard(id){const r=RULES.find(r=>r.id===id);if(!r)return'';return `<div class="rule"><h3>${r.t}<span class="pg">p. ${r.p}</span></h3><ul class="chk">${r.b.map(b=>`<li>${b}</li>`).join('')}</ul></div>`}
function condNotes(e){
 const arr=e.cond,fr=e.fresh||[],out=[];const o=['stordire','rigenerazione','ferita','immobilizzare','disarmare','compromettere','confondere','rinforzo'];
 o.filter(c=>arr.includes(c)).forEach(c=>out.push(`<div class="note ${COND[c].p?'':'w'}">${COND[c].start}</div>`));
 if(arr.includes('veleno'))out.push('<div class="note w">Veleno: gli attacchi contro di lui hanno +1.</div>');
 const auto=S.set.autoexp;
 if(arr.includes('anatema')&&!fr.includes('anatema'))out.push(`<div class="note w">Anatema: a fine turno subisce 10 danni${auto?' (li applica l’app)':''} e Anatema si rimuove.</div>`);
 const ex=arr.filter(c=>COND[c].exp&&!fr.includes(c));if(ex.length)out.push(`<div class="note">${auto?'A fine turno l’app rimuove':'A fine turno rimuovi'}: ${ex.map(c=>COND[c].n).join(', ')}.</div>`);
 return out.join('')}

/* ---------- ordine di iniziativa ---------- */
function order(){
 const e=[];
 S.chars.forEach((c,i)=>{if(!c.ex&&!c.absent)e.push({k:'c',i,id:c.id,name:c.name||'Personaggio',ini:c.rest?99:c.init,i2:c.init2})});
 S.mons.forEach((m,i)=>{if(m.st.length)e.push({k:'m',i,id:m.id,name:m.name||'Mostri',ini:m.init,ally:m.ally})});
 if(S.step>=3)e.sort((a,b)=>(a.ini??1e3)-(b.ini??1e3)||(a.k===b.k?(a.i2??1e3)-(b.i2??1e3):a.k==='c'?-1:1));
 return e}
function current(){return S.step===3?order().find(e=>!S.done.includes(e.id)):null}

  <div class="row"><div class="els">${ELS.map(([k,n])=>{const s=S.els[k]||0;return `<button class="el" style="--c:var(--el-${k})" data-s="${s}" data-a="el" data-k="${k}" title="Tocca: inerte → forte → debole → inerte"><span class="disc"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ELSVG[k]}</svg></span>${n}<i>${ELST[s]}</i></button>`}).join('')}</div><span class="muted small" style="flex:1 1 12em">Tocca un elemento per infonderlo o consumarlo. A fine round calano da soli.</span></div>
  <details id="d-scen"><summary>Scenario${S.scen.name?': '+h(S.scen.name):''} · livello ${L}</summary><div class="col" style="gap:12px">
   <div class="row" style="align-items:flex-end">${inp('Scenario','scen.name',S.scen.name,'text','placeholder="Numero o nome"')}<span class="cnt">Livello scenario${stp('level',L,0,7)}</span>${rec!=null&&rec!==L?`<button class="btn sm" data-a="uselv" data-v="${rec}">Usa il consigliato: ${rec}</button>`:''}</div>
   <div class="status"><span class="kv"><span>${GI('trap')}Trappole</span><b>${LV.trap[L]} danni</b></span><span class="kv"><span>${GI('terrain')}Terreno pericoloso</span><b>${LV.haz[L]}</b></span><span class="kv"><span>${GI('loot')}Oro per moneta</span><b>×${LV.conv[L]}</b></span><span class="kv"><span>${CI('experience')}Esperienza bonus</span><b>+${LV.xp[L]}</b></span></div>
   <label class="f">Regole speciali e note<textarea id="scen-note" data-p="scen.note" placeholder="Regole speciali, sezioni da leggere, obiettivo…">${h(S.scen.note)}</textarea></label></div></details></div>`;
 const next=S.step===0?'Inizia il round 1':S.step===1?'Carte scelte':S.step===2?'Inizia i turni':S.step===3?'Vai a fine round':S.step===4?`Inizia il round ${S.round+1}`:'';
 let ini='';
 if(S.step>=1&&S.step<=3){
  ini=`<div class="panel ini-panel"><div class="row sp"><h2>${GI('initiative')}Iniziativa</h2><span class="muted small">${S.step===3?'Ordine di turno · tocca per segnare fatto':'Scrivi i numeri, Invio per passare al successivo'}</span></div>
  ${ord.length?`<form class="ini" data-ini novalidate>${ord.map((e,n)=>{const c=e.k==='c'?S.chars[e.i]:null,done=S.step===3&&S.done.includes(e.id),isCur=cur&&cur.id===e.id;const base=c?`chars.${e.i}`:`mons.${e.i}`;
   const edit=S.step<3||e.ini==null,sub=[c&&c.rest?'riposo lungo':'',isCur?'<b style="color:var(--accent)">tocca a lui</b>':'',done?'fatto':''].filter(Boolean).join(' · ');
   return `<div class="ini-r ${isCur?'cur':''} ${done?'done':''} ${edit?'':'tg'}" ${edit?'':`data-a="tog" data-id="${e.id}" role="button" tabindex="0" title="${done?'Tocca per riattivare':'Tocca per segnare fatto'}"`}>${S.step===3?`<span class="ordn">${done?'✓':n+1}</span>`:''}${avatar(e.name,c?'c':e.ally?'a':'m',e.i)}
   <span class="nm"><b>${h(e.name)}</b>${sub?`<span class="sub">${sub}</span>`:''}</span>
   ${edit?`<input class="init" type="number" inputmode="numeric" enterkeyhint="${n===ord.length-1?'done':'next'}" min="1" max="99" data-p="${base}.init" value="${h(e.ini??'')}" aria-label="Iniziativa di ${h(e.name)}" placeholder="—">`:`<b class="inum">${h(e.ini)}</b>`}</div>`}).join('')}</form>
   ${S.step<3?'<p class="muted small">Per il riposo lungo scrivi 99.</p>':''}`
   :'<p class="muted">Qui compaiono personaggi e mostri in gioco. <a href="#personaggi">Aggiungi i personaggi</a> e <a href="#mostri">i mostri</a>.</p>'}</div>`}
 let turn='';
 if(S.step===3){
  if(!cur)turn=`<div class="panel"><h2>Tutti hanno agito</h2><p class="muted">Controlla che non siano entrati in gioco nuovi mostri, poi passa a fine round.</p></div>`;
  else if(cur.k==='c'){const c=S.chars[cur.i],p=`chars.${cur.i}`;
   turn=`<div class="panel turn"><div class="turn-h">${avatar(cur.name,'c',cur.i,'xl')}<span class="tn"><span class="lbl">È il turno di</span><h2>${h(cur.name)}</h2></span><button class="btn pri" data-a="endturn">Fine turno</button></div>
   ${c.summons.length?`<div class="note">Prima agiscono le sue evocazioni, in ordine: ${c.summons.map(s=>h(s.name||'evocazione')).join(', ')}.</div>`:''}
   ${condNotes(c)}
   ${c.rest?`<div class="note">Riposo lungo: perdi 1 carta a scelta dagli scarti e riprendi le altre; Cura 2 su te stesso (facoltativo); recupera gli oggetti spesi (facoltativo).</div><div class="row"><button class="btn sm" data-a="lrest" data-i="${cur.i}">Applica riposo lungo</button></div>`
     :'<div class="note">Azione superiore di una carta + azione inferiore dell’altra. A fine turno: saccheggia il tuo esagono, gli elementi infusi diventano forti.</div>'}
   <div class="row">${cnt('<span class="cl">'+CI('health')+'Punti ferita</span>',p+'.hp',c.hp,0,c.maxHp,'hp')}<span style="flex:1 1 120px;align-self:flex-end;padding-bottom:12px">${hpbar(c.hp,c.maxHp,'w')}</span></div>
   <div class="row">${cnt('<span class="cl">'+CI('experience')+'Esperienza</span>',p+'.xp',c.xp)}${cnt('<span class="cl">'+GI('loot')+'Monete</span>',p+'.loot',c.loot)}${cnt('Mano',p+'.hand',c.hand)}${cnt('Scarti',p+'.discard',c.discard)}${cnt('Perse',p+'.lost',c.lost)}</div>
   ${condUI(p+'.cond',c.cond,1)}
   ${miniDeck(p+'.deck')}
   ${S.loot.draw.length||slText(c)?`<div class="row">${S.loot.draw.length?`<button class="btn sm" data-a="lootdraw" data-i="${cur.i}">${CI('loot-token')} Pesca una carta bottino</button>`:''}<span class="muted small">${slText(c)}</span></div>`:''}
   <details id="d-turnsheet" open class="mini"><summary>Scheda della campagna</summary><div class="col" style="gap:10px">${campSheet(c,cur.i,'t-')}</div></details></div>`}
  else{const m=S.mons[cur.i];
   turn=`<div class="panel turn"><div class="turn-h">${avatar(cur.name,m.ally?'a':'m',0,'xl',m.key)}<span class="tn"><span class="lbl">È il turno di</span><h2>${h(cur.name)}</h2></span><button class="btn pri" data-a="endturn">Fine turno</button></div>
   ${monStats(m)}
   <div class="note">Elite prima dei normali, in ordine di pedina. Per ciascuno: focus → movimento → attacco, seguendo la carta dall’alto in basso.</div>
   ${standees(cur.i,true)}${miniDeck(m.ally?'decks.alleati':'decks.mostri')}
   <div class="row"><button class="chip" data-a="act" data-id="focus">Come sceglie il focus?</button><button class="chip" data-a="act" data-id="movmostri">Come si muove?</button></div></div>`}}
 let end='';
 if(S.step===5){const o=S.outcome,win=o==='win';
  end=`<div class="panel"><div class="chips">${[['win','Completato'],['lose','Perso: torniamo a Frosthaven'],['replay','Perso: rigiochiamo subito']].map(([v,l])=>`<button class="chip ${o===v?'on':''}" data-a="outc" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="tblw"><table><tr><th>Personaggio</th><th>Esperienza</th><th>Oro</th><th>Risorse</th><th>Statistiche</th></tr>${S.chars.map(c=>`<tr><td>${h(c.name||c.cls||'—')}</td><td>${c.xp}${win?` + ${LV.xp[L]} = <b>${c.xp+LV.xp[L]}</b>`:''}</td><td>${c.loot} × ${LV.conv[L]} = <b>${c.loot*LV.conv[L]}</b></td><td>${o==='replay'?'non ottenute':slText(c,1)||'—'}</td><td class="small">${(()=>{const t=c.stats||{};return `inflitti ${t.dmg||0} · subiti ${t.taken||0} · cure ${t.heal||0} · uccisioni ${(t.nk||0)+(t.ek||0)}${t.ek?` (${t.ek} elite)`:''}`})()}</td></tr>`).join('')}</table></div>
  ${win?`<div class="note">Completato: segnate anche gli obiettivi della battaglia raggiunti, le ricompense dello scenario e ${Math.max(0,4-S.chars.length)} ispirazione (4 − numero di personaggi).</div>`:o==='lose'?'<div class="note w">Tornando a Frosthaven tenete esperienza, oro, tesori e risorse, e svolgete la Fase dell’Avamposto.</div>':'<div class="note w">Rigiocando subito tenete esperienza, oro e tesori ma non le risorse; niente Fase dell’Avamposto né evento di strada.</div>'}
  <div class="row"><button class="btn pri" data-a="close">Aggiungi alle schede e chiudi lo scenario</button></div>
  <p class="muted small">Punti ferita, condizioni, carte, mostri sulla mappa, elementi e mazzi vengono rimessi a posto; benedizioni e maledizioni escono dai mazzi.</p></div>`}
 const prep=S.step===0?`<div class="panel"><h2>Prepara lo scenario</h2><p class="muted small">Scrivi il numero dello scenario: l’app aggiunge le sue serie di mostri con le statistiche del livello ${L} e compone il mazzo dei bottini. Le pedine sulla mappa le aggiungi tu dalla sezione Mostri.</p><div class="row"><input id="scnum" placeholder="es. 1, 12, 4A" style="width:9em" aria-label="Numero dello scenario"><button class="btn" data-a="scprep">Prepara</button><a href="#mostri">Vai ai mostri</a></div><div class="row" style="align-items:flex-end"><span class="cnt">Livello dello scenario${stp('level',L,0,7)}</span>${rec!=null&&rec!==L?`<button class="btn sm" data-a="uselv" data-v="${rec}">Usa il consigliato: ${rec}</button>`:rec!=null?'<span class="muted small">È il livello consigliato per i vostri personaggi.</span>':''}</div>${S.mons.length?`<p class="small">Serie in gioco: ${S.mons.map(m=>h(m.name)).join(', ')}.</p>`:''}</div>`:'';
 const field=fieldUI();
 const sd=S.side==='bottini'?'bottini':'mazzo';
 const rules=`<div class="panel" id="rules-panel"><h2>Regolamento</h2><div class="chips">${ACTIONS.map(([id,l])=>`<button class="chip ${S.act===id?'on':''}" data-a="act" data-id="${id}">${l}</button>`).join('')}</div>${ruleCard(S.act)}</div>`;
 const side=`<div class="seg">${[['mazzo','Modificatori'],['bottini','Bottini']].map(([v,l])=>`<button class="${sd===v?'on':''}" data-a="side" data-v="${v}">${l}</button>`).join('')}</div>
 ${sd==='mazzo'?deckUI():lootUI()}`;
 const dtxt=S.step===0?'Tutto pronto sul tavolo?':S.step===1?'Ognuno sceglie due carte':S.step===2?'Rivelate le carte e scrivete le iniziative':S.step===3?(cur?`Tocca a ${h(cur.name)}`:'Tutti hanno agito'):'Riposi brevi, mazzi, elementi';
 const dock=S.step===5?'':`<div class="dock"><div class="dock-in"><span class="dk"><span class="lbl">Round ${S.round} · ${SHORT[S.step]}</span><b>${dtxt}</b></span><span class="row"><button class="ibtn" data-a="undo" aria-label="Annulla l’ultima mossa" title="Annulla l’ultima mossa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>${S.step===4?'<button class="btn" data-a="goto" data-i="5">Scenario finito</button>':''}${S.step===3&&cur?'<button class="btn pri big" data-a="endturn">Fine turno</button>':`<button class="btn pri big" data-a="next">${next}</button>`}</span></div></div>`;
 return `${dock}${guide}<div class="game slim"><div class="col">${hero}${field}${turn}${rules}${prep}${end}</div><div class="col">${ini}</div></div>`}

function monStats(m){const rows=m.boss?[['n','Boss','']]:[['e','Elite','e'],['n','Normale','']];const cnt=k=>m.boss?m.st.length:m.st.filter(s=>k==='e'?s.e:!s.e).length;
 return `<div class="tblw"><table class="mst"><tr><th></th><th>${CI('health','Punti ferita')}</th><th>${GI('move','Movimento')}</th><th>${GI('attack','Attacco')}</th><th>${GI('range','Gittata')}</th></tr>${rows.map(([k,l,c])=>{const v=m[k],n=cnt(k),off=n?'':' off';return `<tr class="${v.note?'hn':''}${off}"><td><b${c?' style="color:var(--elite)"':''}>${l}</b> <span class="muted small">×${n}</span></td><td>${h(v.hp??'—')}</td><td>${h(v.mov??'—')}</td><td>${h(v.att??'—')}</td><td>${v.rng?h(v.rng):'—'}</td></tr>${v.note?`<tr class="nt${off}"><td colspan="5">${noteH(v.note)}</td></tr>`:''}`}).join('')}</table></div><p class="muted small">Valori base del livello ${S.level}: aggiungi i modificatori della carta capacità pescata.</p>`}
function standees(mi,turnMode){const m=S.mons[mi];
 const list=m.st.map((s,si)=>({s,si})).sort((a,b)=>(b.s.e-a.s.e)||(a.s.n-b.s.n));
 if(!list.length)return '<p class="muted small">Nessuna pedina sulla mappa.</p>';
 return `<div>${list.map(({s,si})=>{const p=`mons.${mi}.st.${si}`,mx=(s.e?m.e:m.n).hp;
  return `<div class="std"><span class="num ${s.e?'e':''}" title="${s.e?'Elite':'Normale'}">${s.n}</span><span class="hpc">${stp(p+'.hp',s.hp,0,mx,'hp')}${hpbar(s.hp,mx)}</span><span>${condUI(p+'.cond',s.cond,0)}${turnMode?condNotes(s):''}</span><button class="btn sm warn" data-a="kill" data-m="${mi}" data-s="${si}" title="Rimuovi: è morto">Morto</button></div>`}).join('')}</div>`}

function classSel(p,v){const o=x=>`<option value="${h(x)}" ${x===v?'selected':''}>${h(x)}</option>`;
 return `<label class="f">${CLSG[v]?`<span style="display:flex;align-items:center;gap:6px"><i class="ci cg-${CLSG[v]}" style="width:1.4em;height:1.4em" aria-hidden="true"></i>Classe</span>`:'Classe'}<select id="i-${p.replace(/\./g,'-')}-cls" data-p="${p}.cls"><option value="" ${v?'':'selected'}>Scegli la classe…</option>
 <optgroup label="Classi iniziali">${CLASSI.map(o).join('')}</optgroup><optgroup label="Classi da sbloccare (spoiler)">${CLASSI_SB.map(o).join('')}</optgroup>
 ${v&&!CLHP[v]?`<option value="${h(v)}" selected>${h(v)}</option>`:''}</select></label>`}
function campSheet(c,i,pre){const p=`chars.${i}`,nx=XPLV[c.level]??null;return `   <div class="row">${inp('Esperienza totale',p+'.xpTot',c.xpTot,'number','min="0"')}${inp('Oro',p+'.gold',c.gold,'number','min="0"')}${cnt('Segni obiettivo',p+'.perks',c.perks,0,18)}</div>
   <p class="small muted">${nx?(c.xpTot>=nx?`Ha ${c.xpTot} esperienza: può salire al livello ${c.level+1} nella prossima Riorganizzazione.`:`Prossimo livello a ${nx} esperienza (ne mancano ${nx-c.xpTot}).`):'Livello massimo.'} Ogni 3 segni obiettivo: 1 talento. Oggetti piccoli trasportabili: ${Math.ceil(c.level/2)}.</p>
   <div class="res">${RES.map(([k,n])=>cnt(n,`${p}.res.${k}`,c.res[k]||0)).join('')}</div>
   ${(()=>{const mm=(c.mast||[]).filter(Boolean).length,av=(c.level-1)+Math.floor((c.perks||0)/3)+mm+(c.retPrev||0);
   return `<div class="row">${cnt('Talenti usati',p+'.perksUsed',c.perksUsed||0,0,40)}${cnt('Ritiri precedenti',p+'.retPrev',c.retPrev||0,0,20)}<span class="small ${(c.perksUsed||0)>av?'warnc':'muted'}" style="flex:1 1 12em">Talenti disponibili: <b>${av}</b> (livello ${c.level-1} + segni ${Math.floor((c.perks||0)/3)} + maestrie ${mm} + ritiri ${c.retPrev||0})</span></div>`})()}
   <div class="row"><label class="small"><input type="checkbox" id="${pre}m0-${c.id}" data-p="${p}.mast.0" ${c.mast&&c.mast[0]?'checked':''}> Maestria 1</label><label class="small"><input type="checkbox" id="${pre}m1-${c.id}" data-p="${p}.mast.1" ${c.mast&&c.mast[1]?'checked':''}> Maestria 2</label></div>
   <div class="row" style="align-items:flex-end"><label class="f" style="flex:1 1 12em">Missione personale<input id="${pre}pq-${c.id}" data-p="${p}.pq" value="${h(c.pq||'')}" placeholder="Numero o nome della carta"></label><label class="small"><input type="checkbox" id="${pre}pqd-${c.id}" data-p="${p}.pqDone" ${c.pqDone?'checked':''}> completata</label></div>
   <label class="f">Note (talenti scelti, oggetti, altro)<textarea data-p="${p}.notes" id="n-${pre}${c.id}">${h(c.notes)}</textarea></label>`}
function itemsUI(c,i){const p=`chars.${i}`,small=c.items.filter(x=>x.slot==='piccolo').length,lim=Math.ceil(c.level/2);
 return `<div><div class="row sp"><b class="small">Oggetti</b><button class="btn sm" data-a="additem" data-i="${i}">+ Oggetto</button></div>
 ${c.items.map((x,k)=>`<div class="row item-r"><input data-p="${p}.items.${k}.n" value="${h(x.n)}" placeholder="Nome o numero" aria-label="Oggetto"><select data-p="${p}.items.${k}.slot" aria-label="Tipo di oggetto">${SLOTS.map(([v,l])=>`<option value="${v}" ${x.slot===v?'selected':''}>${l}</option>`).join('')}</select><select class="st-${x.st}" data-p="${p}.items.${k}.st" aria-label="Stato dell’oggetto"><option value="pronto" ${x.st==='pronto'?'selected':''}>Pronto</option><option value="speso" ${x.st==='speso'?'selected':''}>Speso</option><option value="perso" ${x.st==='perso'?'selected':''}>Perso</option></select><button class="btn sm ghost" data-a="delitem" data-i="${i}" data-k="${k}" aria-label="Togli oggetto">×</button></div>`).join('')}
 ${small>lim?`<p class="small warnc">Oggetti piccoli: ${small}, ma al livello ${c.level} se ne possono portare ${lim}.</p>`:''}</div>
 <div><div class="row sp"><b class="small">Contatori speciali</b><button class="btn sm" data-a="addcnt" data-i="${i}">+ Contatore</button></div>
 ${c.cnt.map((x,k)=>`<div class="row item-r"><input data-p="${p}.cnt.${k}.n" value="${h(x.n)}" placeholder="Nome, es. gettoni" aria-label="Nome del contatore" style="flex:1 1 8em">${stp(`${p}.cnt.${k}.v`,x.v,0,99)}<button class="btn sm ghost" data-a="delcnt" data-i="${i}" data-k="${k}" aria-label="Togli contatore">×</button></div>`).join('')}</div>`}
function charCard(c,i){const p=`chars.${i}`,nx=XPLV[c.level]??null;
  return `<div class="panel"><div class="card-h">${avatar(c.name||c.cls,'c',i)}${inp('Nome',p+'.name',c.name)}${classSel(p,c.cls)}</div>
  <div class="row"><label class="btn sm">${c.img?'Cambia immagine':'Usa una tua immagine'}<input type="file" accept="image/*" data-img="${p}" hidden></label>${c.img?`<button class="btn sm" data-a="delimg" data-i="${i}">Torna all’icona della classe</button>`:''}</div>
  <div class="row">${cnt('<span class="cl">'+GI('level')+'Livello</span>',p+'.level',c.level,1,9)}${cnt('PF massimi',p+'.maxHp',c.maxHp,1,40)}${cnt('<span class="cl">'+CI('health')+'Punti ferita</span>',p+'.hp',c.hp,0,c.maxHp,'hp')}</div>
  ${hpbar(c.hp,c.maxHp,'w')}
  <div>${condUI(p+'.cond',c.cond,1)}</div>
  <div class="row">${cnt('Mano',p+'.hand',c.hand)}${cnt('Scarti',p+'.discard',c.discard)}${cnt('Perse',p+'.lost',c.lost)}</div>
  <div class="row"><button class="btn sm" data-a="srest" data-i="${i}" title="Perdi 1 carta casuale dagli scarti, riprendi le altre">Riposo breve</button><button class="btn sm" data-a="lrest" data-i="${i}" title="Perdi 1 carta a scelta, riprendi le altre, Cura 2">Riposo lungo</button><label class="small"><input type="checkbox" data-p="${p}.ex" ${c.ex?'checked':''}> sfinito</label><label class="small" title="Non gioca questo scenario: salta l’iniziativa e non conta per i punti ferita dei mostri"><input type="checkbox" data-p="${p}.absent" ${c.absent?'checked':''}> assente</label></div>
  <div class="row">${cnt('<span class="cl">'+CI('experience')+'Esperienza scenario</span>',p+'.xp',c.xp)}${cnt('<span class="cl">'+GI('loot')+'Monete raccolte</span>',p+'.loot',c.loot)}<span class="small muted">${slText(c)}</span></div>
  <div><div class="row sp"><b class="small">Evocazioni</b><button class="btn sm" data-a="addsum" data-i="${i}">+ Evocazione</button></div>
  ${c.summons.map((s,si)=>`<div class="row" style="margin-top:6px"><input style="flex:1 1 7em" data-p="${p}.summons.${si}.name" value="${h(s.name)}" placeholder="Nome" aria-label="Nome evocazione">${stp(`${p}.summons.${si}.hp`,s.hp,0,40,'hp')}${['att','mov','rng'].map((f,k)=>`<input type="number" min="0" style="width:3.6em" data-p="${p}.summons.${si}.${f}" value="${h(s[f]??'')}" placeholder="${['Att','Mov','Git'][k]}" title="${['Attacco','Movimento','Gittata'][k]}" aria-label="${['Attacco','Movimento','Gittata'][k]}">`).join('')}<button class="btn sm warn" data-a="delsum" data-i="${i}" data-s="${si}" aria-label="Rimuovi evocazione">×</button></div>`).join('')}</div>
  ${itemsUI(c,i)}
